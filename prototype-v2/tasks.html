<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>משימות — המרכז האישי</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="ניווט ראשי">
      <a class="brand" href="./index.html"><span class="brand__mark">מ</span><span><strong>המרכז האישי</strong><small>הכול מתחבר כאן</small></span></a>
      <nav class="sidebar__nav">
        <a class="nav-item" href="./index.html"><span>⌂</span>ראשי</a>
        <a class="nav-item" href="./projects.html"><span>◇</span>פרויקטים</a>
        <a class="nav-item" href="./documents.html"><span>▤</span>מסמכים</a>
        <a class="nav-item is-active" href="./tasks.html"><span>✓</span>משימות</a>
      </nav>
      <a class="nav-item sidebar__bottom" href="./connections.html"><span>⌁</span>חיבורים</a>
    </aside>
    <main class="main-content">
      <header class="topbar"><h2>המרכז האישי</h2></header>
      <div class="page-wrap page-wrap--catalog">
        <section class="catalog-hero"><div><p class="eyebrow"><span></span> מרכז הביצוע</p><h1>מה צריך לקרות עכשיו?</h1><p>כל המשימות מכל הפרויקטים, לפי הזמן והעדיפות שלהן.</p></div></section>
        <section class="panel task-creator">
          <div class="section-heading section-heading--compact"><div><p class="eyebrow">פעולה חדשה</p><h2>יצירת משימה</h2></div></div>
          <form data-task-form class="task-form task-form--full">
            <label><span>מה צריך לעשות?</span><input name="title" required maxlength="200" placeholder="למשל: לחזור ללקוח עם הצעה" /></label>
            <label><span>פרויקט</span><select name="projectId" required data-project-select><option value="">טוען פרויקטים…</option></select></label>
            <label><span>תאריך יעד</span><input name="dueDate" type="date" /></label>
            <label><span>עדיפות</span><select name="priority"><option value="medium">בינונית</option><option value="high">גבוהה</option><option value="low">נמוכה</option></select></label>
            <button class="primary-button" type="submit">＋ יצירת משימה</button>
          </form>
        </section>
        <section class="panel">
          <div class="section-heading section-heading--compact"><div><p class="eyebrow">סדר יום</p><h2>המשימות שלי</h2></div><span data-task-count></span></div>
          <div class="task-toolbar" role="group" aria-label="סינון משימות">
            <button class="is-active" data-task-filter="open">פתוחות</button><button data-task-filter="today">היום</button><button data-task-filter="week">השבוע</button><button data-task-filter="overdue">באיחור</button><button data-task-filter="completed">הושלמו</button>
          </div>
          <div class="task-worklist" data-tasks-list aria-live="polite"></div>
        </section>
      </div>
    </main>
  </div>
  <nav class="mobile-nav" aria-label="ניווט נייד"><a href="./index.html"><span>⌂</span>ראשי</a><a href="./projects.html"><span>◇</span>פרויקטים</a><a href="./documents.html"><span>▤</span>מסמכים</a><a class="is-active" href="./tasks.html"><span>✓</span>משימות</a></nav>
  <div class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./tasks-app.mjs"></script>
</body>
</html>
