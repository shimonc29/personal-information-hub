<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>פרויקטים — המרכז האישי</title><link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&amp;display=swap" rel="stylesheet" /><link rel="stylesheet" href="./styles.css" /></head>
<body><div class="app-shell">
  <aside class="sidebar" aria-label="ניווט ראשי"><a class="brand" href="./index.html"><span class="brand__mark">מ</span><span><strong>המרכז האישי</strong><small>הכול מתחבר כאן</small></span></a><nav class="sidebar__nav"><a class="nav-item" href="./index.html"><span>⌂</span>ראשי</a><a class="nav-item is-active" href="./projects.html"><span>◇</span>פרויקטים</a><a class="nav-item" href="./documents.html"><span>▤</span>מסמכים</a><a class="nav-item" href="./tasks.html"><span>✓</span>משימות</a></nav><a class="nav-item sidebar__bottom" href="./connections.html"><span>⌁</span>חיבורים</a></aside>
  <main class="main-content"><header class="topbar"><h2>המרכז האישי</h2><button class="primary-button" data-new-project>＋ פרויקט חדש</button></header>
    <div class="page-wrap page-wrap--catalog"><section class="catalog-hero"><div><p class="eyebrow"><span></span> מרחב העבודה שלך</p><h1>פרויקטים</h1><p>מכאן מנהלים את העבודה, המסמכים והפעולה הבאה של כל תחום.</p></div><div class="catalog-summary"><strong data-project-total>—</strong><span>פרויקטים<br />פעילים</span><i></i><strong data-attention-total>—</strong><span>דורשים<br />תשומת לב</span></div></section>
      <section class="catalog-toolbar" aria-label="סינון פרויקטים"><label><span>⌕</span><input id="project-search" type="search" placeholder="חיפוש לפי פרויקט או לקוח" /></label><div class="filter-pills"><button class="is-active" data-filter="all">הכול</button><button data-filter="active">פעילים</button><button data-filter="waiting">ממתינים</button><button data-filter="planning">בתכנון</button><button data-filter="completed">הושלמו</button><button data-filter="archived">ארכיון</button></div></section>
      <div class="catalog-meta"><span data-result-count></span><span>הנתונים נשמרים בחשבון שלך</span></div><section class="project-grid catalog-grid" data-projects-grid aria-live="polite"></section>
    </div>
  </main></div>
  <nav class="mobile-nav" aria-label="ניווט נייד"><a href="./index.html"><span>⌂</span>ראשי</a><a class="is-active" href="./projects.html"><span>◇</span>פרויקטים</a><a href="./documents.html"><span>▤</span>מסמכים</a><a href="./tasks.html"><span>✓</span>משימות</a></nav>
  <dialog class="project-dialog" data-project-dialog aria-labelledby="project-dialog-title"><form method="dialog" data-project-form><header><div><p class="eyebrow">ניהול פרויקט</p><h2 id="project-dialog-title" data-dialog-title>פרויקט חדש</h2></div><button type="button" class="dialog-close" data-dialog-close aria-label="סגירה">×</button></header><div class="project-form-grid"><label><span>שם הפרויקט</span><input name="name" maxlength="200" required /></label><label><span>לקוח או ארגון</span><input name="client" maxlength="200" /></label><label class="project-form-wide"><span>תיאור קצר</span><textarea name="description" maxlength="2000" rows="3"></textarea></label><label class="project-form-wide"><span>הפעולה הבאה</span><input name="nextAction" maxlength="500" placeholder="מה הדבר הבא שצריך לקרות?" /></label><label><span>סטטוס</span><select name="status"><option value="planning">בתכנון</option><option value="active">פעיל</option><option value="waiting">ממתין</option><option value="completed">הושלם</option><option value="archived">בארכיון</option></select></label></div><footer><button type="button" data-dialog-cancel>ביטול</button><button class="primary-button" type="submit" data-project-submit>שמירת הפרויקט</button></footer><p class="form-feedback" data-project-feedback role="status"></p></form></dialog>
  <div class="toast" role="status" aria-live="polite"></div><script type="module" src="./projects-app.mjs"></script>
</body></html>
