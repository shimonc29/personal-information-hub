<!doctype html><html lang="he" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>מרחב פרויקט · המרכז האישי</title><link rel="stylesheet" href="./tokens.css"><link rel="stylesheet" href="./styles.css"></head>
<body><div class="app-shell"><aside class="sidebar" aria-label="ניווט ראשי"><a class="brand" href="./index.html"><span class="brand__mark">מ</span><span><strong>המרכז האישי</strong><small>הכול מתחבר כאן</small></span></a><nav class="sidebar__nav"><a class="nav-item" href="./index.html"><span>⌂</span>ראשי</a><a class="nav-item is-active" href="./projects.html"><span>◇</span>פרויקטים</a><a class="nav-item" href="./documents.html"><span>▤</span>מסמכים</a><a class="nav-item" href="./tasks.html"><span>✓</span>משימות</a></nav><div class="sidebar__footer"><a class="nav-item" href="./connections.html"><span>⌁</span>חיבורים</a></div></aside>
<main class="main"><header class="topbar"><div class="topbar__actions"><span class="avatar">שכ</span></div></header><div class="page-wrap page-wrap--detail" data-project-workspace>
<a class="back-link" href="./projects.html">→ חזרה לפרויקטים</a>
<section class="workspace-hero" data-project-header aria-live="polite"><div class="workspace-skeleton">טוען את מרחב הפרויקט…</div></section>
<p class="workspace-alert" data-project-error role="alert" hidden></p>
<section class="workspace-grid">
<article class="panel workspace-main"><div class="section-heading section-heading--compact"><div><p class="eyebrow">ביצוע</p><h2>משימות פתוחות</h2></div><span class="workspace-count" data-project-task-count></span></div><div class="agenda-list" data-project-tasks aria-live="polite"><p class="task-empty">טוען משימות…</p></div></article>
<article class="panel workspace-create"><div class="section-heading section-heading--compact"><div><p class="eyebrow">הפעולה הבאה</p><h2>משימה חדשה</h2></div></div><form class="workspace-task-form" data-project-task-form hidden><label><span>מה צריך לעשות?</span><input name="title" required maxlength="200" placeholder="למשל: לשלוח את ההצעה לאישור"></label><div class="workspace-form-row"><label><span>מועד</span><input name="dueLabel" maxlength="80" placeholder="היום / השבוע"></label><label><span>עדיפות</span><select name="priority"><option value="בינונית">בינונית</option><option value="גבוהה">גבוהה</option><option value="נמוכה">נמוכה</option></select></label></div><button class="primary-button" type="submit">＋ יצירת משימה</button><span class="form-feedback" data-project-task-feedback role="status"></span></form></article>
<article class="panel workspace-documents"><div class="section-heading section-heading--compact"><div><p class="eyebrow">Google Drive · קריאה בלבד</p><h2>מסמכים משויכים</h2></div><span class="workspace-count" data-project-document-count></span></div><div class="workspace-document-list" data-project-documents aria-live="polite"><p class="task-empty">טוען מסמכים…</p></div></article>
</section></div></main></div><nav class="mobile-nav mobile-nav--four" aria-label="ניווט נייד"><a href="./index.html"><span>⌂</span>ראשי</a><a class="is-active" href="./projects.html"><span>◇</span>פרויקטים</a><a href="./documents.html"><span>▤</span>מסמכים</a><a href="./tasks.html"><span>✓</span>משימות</a></nav><script type="module" src="./project-app.mjs"></script></body></html>
